name: Generate JSON Schema

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  generate-and-upload-schema:
    name: Generate and Upload Rules JSON Schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Generate JSON Schema for Rules
        id: generate_schema
        run: uv run python -m radiko_timeshift_recorder gen-json-schema-for-rules > rules.schema.json

      - name: Upload JSON Schema to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} rules.schema.json --clobber
